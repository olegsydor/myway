services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myway_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app
    networks:
      - myway_network

  db:
    image: postgres:17
    container_name: myway_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - myway_network

volumes:
  postgres_data:


networks:
  myway_network:
    driver: bridge
